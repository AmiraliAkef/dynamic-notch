# Generate the Xcode project with:  xcodegen   (brew install xcodegen)
name: DynamicNotch
options:
  bundleIdPrefix: com.amirali.dynamicnotch
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    # Free "Personal Team" signing works; change this to your own team ID.
    DEVELOPMENT_TEAM: 84QXVNFSPV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DynamicNotch:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../Sources/NotchShared/AgentStatus.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirali.dynamicnotch.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dynamic Notch
        NSSupportsLiveActivities: true
        NSBluetoothAlwaysUsageDescription: Dynamic Notch connects to your Mac over Bluetooth to show what your agents are doing.
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - target: DynamicNotchWidgets
  DynamicNotchWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - path: ../Sources/NotchShared/AgentStatus.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirali.dynamicnotch.ios.widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Dynamic Notch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
